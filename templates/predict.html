<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction</title>

    <style>
        body {
            background-color: #a3cfb4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            background-color: transparent;
            padding: 40px;
            border-radius: 10px;
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
        }

        h1{
            color: #5e3131;
            font-size: 2.5rem;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .flower-name {
            font-style: italic;
            color: #0026ff;
        }

        img {
            width: 100%;
            max-width: 400px;
            margin: 20px 0;
            border-radius: 8px;
        }

        a {
            text-decoration: none;
            font-size: 1.2rem;
            color: #fff;
            padding: 10px 20px;
            background-color: #6a1b9a;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        a:hover {
            background-color: #8e24aa;
        }

    </style>
</head>
<body class="prediction">
    <div class="container prediction">
        <h1 class="prediction">Prediction</h1>

        {% if data == 0 %}
            <h1 class="flower-name">Iris-setosa</h1>
            <img src="static/img/setosa.jpeg" alt="Iris-setosa">
        {% elif data == 1 %}
            <h1 class="flower-name">Iris-versicolor</h1>
            <img src="static/img/versicolor.jpeg" alt="Iris-versicolor">
        {% elif data == 2 %}
            <h1 class="flower-name">Iris-virginica</h1>
            <img src="static/img/virginica.jpeg" alt="Iris-virginica">
        {% endif %}

        <br><br>
        <a href="/">Go back to home page</a>
    </div>
</body>
</html>
